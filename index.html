<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOZake</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #e8e4dc;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================
       INTRO
    ========================= */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #e8e4dc;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #intro video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #startIntro {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: 1px solid #111;
      background: #e8e4dc;
      color: #111;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      z-index: 10;
    }


    /* =========================
       WEBSITE
    ========================= */

    #website {
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #website.visible {
      opacity: 1;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      mix-blend-mode: normal;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: -3px;
    }

    nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1.5px;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e4dc;
    }

    /*
      This video is NOT animated.
      It is positioned on the homepage
      and held on its final graffiti frame.
    */

    #heroGraffiti {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }


    /* =========================
       GENERAL
    ========================= */

    section {
      min-height: 75vh;
      padding: 120px 7%;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .large-title {
      font-size: clamp(45px, 8vw, 110px);
      font-weight: 400;
      letter-spacing: -5px;
      line-height: 0.9;
      max-width: 900px;
    }

    .body-text {
      margin-top: 25px;
      font-size: 16px;
      line-height: 1.5;
      max-width: 500px;
    }

    .discover {
      display: inline-block;
      margin-top: 35px;
      color: #111;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
    }


    /* =========================
       WORLD
    ========================= */

    .world {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    /* =========================
       LATEST
    ========================= */

    .latest {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .art-placeholder {
      margin-top: 45px;
      width: 100%;
      min-height: 420px;
      border: 1px solid #d4d0c8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      letter-spacing: 2px;
    }


    /* =========================
       STORY
    ========================= */

    .story {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      min-height: 45vh;
      padding: 100px 7% 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .footer-title {
      font-size: clamp(45px, 8vw, 110px);
      font-weight: 400;
      letter-spacing: -5px;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 80px;
    }

    .footer-logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: -4px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 20px;
      }

      .logo {
        font-size: 18px;
      }

      nav {
        gap: 9px;
      }

      nav a {
        font-size: 8px;
        letter-spacing: 0.8px;
      }

      section {
        padding: 90px 24px;
      }

      .large-title {
        letter-spacing: -3px;
      }

      .art-placeholder {
        min-height: 300px;
      }

      footer {
        padding: 80px 24px 35px;
      }

      .footer-bottom {
        margin-top: 60px;
      }

      #heroGraffiti {
        object-fit: cover;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       MOZake INTRO
  ========================= -->

  <div id="intro">

    <video
      id="introVideo"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="MOZake-intro.mp4" type="video/mp4">
    </video>

    <button id="startIntro">START</button>

  </div>



  <!-- =========================
       WEBSITE
  ========================= -->

  <div id="website">


    <!-- =========================
         HEADER
    ========================= -->

    <header>

      <div class="logo">▲▲</div>

      <nav>
        <a href="#art">ART</a>
        <a href="#clothing">CLOTHING</a>
        <a href="#collectibles">COLLECTIBLES</a>
        <a href="#story">STORY</a>
        <a href="#shop">SHOP</a>
      </nav>

    </header>



    <main>


      <!-- =========================
           HERO
      ========================= -->

      <section class="hero">

        <!--
          Same intro video.
          Once the intro finishes,
          this video is frozen on
          the final graffiti frame.
        -->

        <video
          id="heroGraffiti"
          muted
          playsinline
          webkit-playsinline
          preload="auto"
        >
          <source src="MOZake-intro.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

      </section>



      <!-- =========================
           THE WORLD
      ========================= -->

      <section class="world">

        <p class="eyebrow">
          THE WORLD OF MOZake
        </p>

        <h2 class="large-title">
          Art.<br>
          Clothing.<br>
          Collectibles.
        </h2>

      </section>



      <!-- =========================
           LATEST
      ========================= -->

      <section class="latest" id="art">

        <p class="eyebrow">
          LATEST
        </p>

        <h2 class="large-title">
          MOZake
        </h2>

        <div class="art-placeholder">
          ORIGINAL MOZake ARTWORK
        </div>

        <a class="discover" href="#">
          DISCOVER →
        </a>

      </section>



      <!-- =========================
           STORY
      ========================= -->

      <section class="story" id="story">

        <p class="eyebrow">
          THE STORY
        </p>

        <h2 class="large-title">
          Every creation<br>
          has a beginning.
        </h2>

        <a class="discover" href="#">
          DISCOVER →
        </a>

      </section>



      <!-- =========================
           CLOTHING
      ========================= -->

      <section id="clothing">

        <p class="eyebrow">
          THE WORLD OF MOZake
        </p>

        <h2 class="large-title">
          MAKE IT EXIST.
        </h2>

      </section>


    </main>



    <!-- =========================
         FOOTER / SHOP
    ========================= -->

    <footer id="shop">

      <h2 class="footer-title">
        SHOP MOZake
      </h2>

      <div class="footer-bottom">

        <div class="footer-logo">
          ▲▲
        </div>

        <div>

          <a class="discover" href="#">
            CLOTHING
          </a>

          <br>

          <a class="discover" href="#">
            COLLECTIBLES
          </a>

          <br>

          <a class="discover" href="#">
            ART
          </a>

        </div>

      </div>

    </footer>


  </div>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const intro = document.getElementById("intro");
    const introVideo = document.getElementById("introVideo");
    const heroVideo = document.getElementById("heroGraffiti");
    const website = document.getElementById("website");
    const startButton = document.getElementById("startIntro");

    let introFinished = false;


    /* =========================
       HERO FINAL FRAME
    ========================= */

    function showGraffitiFrame() {

      if (heroVideo.readyState >= 1) {

        if (heroVideo.duration && isFinite(heroVideo.duration)) {
          heroVideo.currentTime = Math.max(0, heroVideo.duration - 0.05);
        }

      } else {

        heroVideo.addEventListener("loadedmetadata", () => {

          if (heroVideo.duration && isFinite(heroVideo.duration)) {
            heroVideo.currentTime = Math.max(0, heroVideo.duration - 0.05);
          }

        }, { once: true });

      }

    }


    /* =========================
       FINISH INTRO
    ========================= */

    function finishIntro() {

      if (introFinished) return;

      introFinished = true;


      /*
        Remember that this browser tab
        has already watched the intro.
      */

      try {
        sessionStorage.setItem("mozakeIntroSeen", "true");
      } catch (error) {}


      /*
        Prepare the graffiti background
        before showing the homepage.
      */

      showGraffitiFrame();


      intro.classList.add("hidden");
      website.classList.add("visible");


      setTimeout(() => {
        intro.remove();
      }, 1200);

    }



    /* =========================
       CHECK SESSION
    ========================= */

    let hasSeenIntro = false;

    try {
      hasSeenIntro =
        sessionStorage.getItem("mozakeIntroSeen") === "true";
    } catch (error) {
      hasSeenIntro = false;
    }


    /*
      Safari sometimes reports a page reload
      differently, so we also check the
      browser navigation type.
    */

    let isReload = false;

    try {

      const navigation =
        performance.getEntriesByType("navigation")[0];

      if (navigation && navigation.type === "reload") {
        isReload = true;
      }

    } catch (error) {}



    /* =========================
       IF ALREADY SEEN
    ========================= */

    if (hasSeenIntro || isReload) {

      showGraffitiFrame();

      intro.remove();

      website.classList.add("visible");

    }



    /* =========================
       FIRST VISIT
    ========================= */

    else {

      introVideo.addEventListener(
        "ended",
        finishIntro
      );


      startButton.addEventListener(
        "click",
        () => {

          startButton.style.display = "none";

          introVideo.currentTime = 0;

          introVideo.play().catch(() => {

            startButton.style.display = "block";

          });

        }
      );


      /*
        Try autoplay.
        If Safari blocks it,
        show START.
      */

      introVideo.play().then(() => {

        startButton.style.display = "none";

      }).catch(() => {

        startButton.style.display = "block";

      });

    }

  </script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — MOZake</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #e2ded4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    header {
      width: 100%;
      padding: 22px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 48px;
    }

    .logo {
      display: flex;
      align-items: center;
      width: 62px;
      height: 48px;
      text-decoration: none;
    }

    .mozake-logo {
      width: 62px;
      height: 48px;
      display: block;
      overflow: visible;
    }

    .mozake-logo polygon {
      fill: #111;
    }

    nav {
      display: flex !important;
      gap: 40px !important;
      align-items: center !important;
    }

    nav a {
      color: #111 !important;
      text-decoration: none !important;
      font-size: 21px !important;
      font-weight: 600 !important;
      letter-spacing: 2.5px !important;
      white-space: nowrap !important;
      line-height: 1 !important;
    }

    nav a.current {
      opacity: 0.45;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .cart-link {
      color: #111;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .account-link {
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      text-decoration: none;
    }

    .account-icon {
      width: 22px;
      height: 22px;
      display: block;
    }

    .page-hero {
      padding: 72px 32px 60px;
    }

    .eyebrow {
      margin: 0 0 20px;
      font-size: 16px;
      letter-spacing: 3px;
      font-weight: 600;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(70px, 15vw, 220px);
      line-height: 0.82;
      letter-spacing: -7px;
      font-weight: 700;
    }

    .checkout-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 32px 120px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.7fr);
      gap: 80px;
      align-items: start;
    }

    .section-title {
      margin: 0 0 30px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .form-section {
      margin-bottom: 55px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    input,
    select {
      width: 100%;
      min-height: 52px;
      padding: 14px 15px;
      border: 1px solid #111;
      border-radius: 0;
      background: #e2ded4;
      color: #111;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      box-shadow: inset 0 0 0 1px #111;
    }

    select {
      appearance: auto;
    }

    .order-summary {
      position: sticky;
      top: 25px;
      border-top: 1px solid #111;
      padding-top: 25px;
    }

    .summary-title {
      margin: 0 0 25px;
      font-size: 25px;
      letter-spacing: 2px;
    }

    .summary-items {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 25px;
      border-bottom: 1px solid #111;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 15px;
    }

    .summary-item-name {
      font-weight: 600;
    }

    .summary-item-qty {
      opacity: 0.6;
      margin-left: 5px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      padding-top: 18px;
      font-size: 16px;
    }

    .summary-total {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #111;
      font-size: 23px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .checkout-button {
      width: 100%;
      margin-top: 30px;
      min-height: 58px;
      border: 1px solid #111;
      background: #111;
      color: #e2ded4;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .checkout-button:hover {
      background: transparent;
      color: #111;
    }

    .checkout-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #111;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .status {
      margin-bottom: 25px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    footer {
      background: #111;
      color: #e2ded4;
      padding: 35px 32px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    @media (max-width: 900px) {
      header {
        padding: 16px 16px 14px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 13px;
      }

      .header-left {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0;
      }

      .logo {
        width: 48px;
        height: 38px;
      }

      .mozake-logo {
        width: 48px;
        height: 38px;
      }

      nav {
        width: 100%;
        justify-content: space-between !important;
        gap: 0 !important;
      }

      nav a {
        font-size: 15px !important;
        letter-spacing: 1.15px !important;
      }

      .header-tools {
        position: absolute;
        top: 18px;
        right: 16px;
      }

      .cart-link {
        font-size: 13px;
        letter-spacing: 1.5px;
      }

      .account-link {
        width: 34px;
        height: 34px;
      }

      .account-icon {
        width: 32px;
        height: 32px;
      }

      .page-hero {
        padding: 55px 16px 45px;
      }

      .hero-title {
        font-size: clamp(65px, 22vw, 150px);
        letter-spacing: -5px;
      }

      .checkout-wrap {
        padding: 25px 16px 80px;
      }

      .checkout-grid {
        grid-template-columns: 1fr;
        gap: 65px;
      }

      .order-summary {
        position: static;
      }

      .field-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .field.full {
        grid-column: auto;
      }

      .section-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-left">

    <a href="./index.html" class="logo" aria-label="MOZake">
      <svg class="mozake-logo" viewBox="0 0 82 58" aria-label="MOZake logo">
        <polygon points="2,55 29,7 56,55"></polygon>
        <polygon points="27,51 54,3 81,51"></polygon>
      </svg>
    </a>

    <nav>
      <a href="./art.html">ART</a>
      <a href="./clothing.html">CLOTHING</a>
      <a href="./collectibles.html">COLLECTIBLES</a>
      <a href="./story.html">STORY</a>
      <a href="./shop.html">SHOP</a>
    </nav>

  </div>

  <div class="header-tools">
    <a href="./cart.html" class="cart-link">CART</a>

    <a href="./account.html" class="account-link" aria-label="Account" title="Account">
      <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M5.5 19c.7-3.1 3-5 6.5-5s5.8 1.9 6.5 5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"/>
      </svg>
    </a>
  </div>
</header>


<section class="page-hero">
  <p class="eyebrow">THE WORLD OF MOZake</p>
  <h1 class="hero-title">CHECKOUT</h1>
</section>


<main class="checkout-wrap">

  <div id="status" class="status">LOADING CHECKOUT...</div>

  <div class="checkout-grid">

    <section>

      <form id="checkout-form">

        <div class="form-section">
          <h2 class="section-title">CONTACT</h2>

          <div class="field-grid">

            <div class="field full">
              <label for="email">EMAIL</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              >
            </div>

          </div>
        </div>


        <div class="form-section">
          <h2 class="section-title">SHIPPING ADDRESS</h2>

          <div class="field-grid">

            <div class="field">
              <label for="firstName">FIRST NAME</label>
              <input
                id="firstName"
                name="firstName"
                autocomplete="given-name"
                required
              >
            </div>

            <div class="field">
              <label for="lastName">LAST NAME</label>
              <input
                id="lastName"
                name="lastName"
                autocomplete="family-name"
                required
              >
            </div>

            <div class="field full">
              <label for="country">COUNTRY / REGION</label>

              <select
                id="country"
                name="country"
                autocomplete="country-name"
                required
              >
                <option value="">SELECT COUNTRY / REGION</option>
                <option value="AU">Australia</option>
                <option value="NZ">New Zealand</option>
                <option value="US">United States</option>
                <option value="CA">Canada</option>
                <option value="GB">United Kingdom</option>
                <option value="IE">Ireland</option>
                <option value="FR">France</option>
                <option value="DE">Germany</option>
                <option value="IT">Italy</option>
                <option value="ES">Spain</option>
                <option value="NL">Netherlands</option>
                <option value="BE">Belgium</option>
                <option value="AT">Austria</option>
                <option value="CH">Switzerland</option>
                <option value="SE">Sweden</option>
                <option value="NO">Norway</option>
                <option value="DK">Denmark</option>
                <option value="FI">Finland</option>
                <option value="PL">Poland</option>
                <option value="PT">Portugal</option>
                <option value="GR">Greece</option>
                <option value="JP">Japan</option>
                <option value="KR">South Korea</option>
                <option value="CN">China</option>
                <option value="SG">Singapore</option>
                <option value="HK">Hong Kong</option>
                <option value="IN">India</option>
                <option value="ID">Indonesia</option>
                <option value="MY">Malaysia</option>
                <option value="TH">Thailand</option>
                <option value="PH">Philippines</option>
                <option value="VN">Vietnam</option>
                <option value="BR">Brazil</option>
                <option value="MX">Mexico</option>
                <option value="AR">Argentina</option>
                <option value="CL">Chile</option>
                <option value="ZA">South Africa</option>
                <option value="AE">United Arab Emirates</option>
                <option value="SA">Saudi Arabia</option>
              </select>
            </div>

            <div class="field full">
              <label for="address">ADDRESS</label>
              <input
                id="address"
                name="address"
                autocomplete="street-address"
                placeholder="Street address"
                required
              >
            </div>

            <div class="field">
              <label for="city">CITY / SUBURB</label>
              <input
                id="city"
                name="city"
                autocomplete="address-level2"
                required
              >
            </div>

            <div class="field">
              <label for="region">STATE / PROVINCE / REGION</label>

              <input
                id="region"
                name="region"
                autocomplete="address-level1"
                placeholder="State / province / region"
                required
              >
            </div>

            <div class="field">
              <label for="postcode">POSTCODE / ZIP</label>
              <input
                id="postcode"
                name="postcode"
                autocomplete="postal-code"
                required
              >
            </div>

            <div class="field">
              <label for="phone">PHONE</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
              >
            </div>

          </div>
        </div>


        <button
          type="submit"
          class="checkout-button"
          id="payment-button"
        >
          CONTINUE TO PAYMENT →
        </button>

      </form>

      <a href="./cart.html" class="back-link">← BACK TO CART</a>

    </section>


    <aside class="order-summary">

      <h2 class="summary-title">YOUR ORDER</h2>

      <div id="summary-items" class="summary-items"></div>

      <div class="summary-line">
        <span>SUBTOTAL</span>
        <span id="subtotal">$0.00 AUD</span>
      </div>

      <div class="summary-line">
        <span>SHIPPING</span>
        <span>CALCULATED NEXT</span>
      </div>

      <div class="summary-total">
        <span>TOTAL</span>
        <span id="total">$0.00 AUD</span>
      </div>

    </aside>

  </div>

</main>


<footer>
  MOZake — MAKE IT EXIST.
</footer>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
  onload="window.dispatchEvent(new Event('supabase-ready'))"
  onerror="window.dispatchEvent(new Event('supabase-failed'))">
</script>


<script>
  const SUPABASE_URL = "https://cjyhqxffjppmzgsgrsvt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_vDNha1HTi57tHedL3KgSzA_DnyVaEj5";

  let supabaseClient = null;
  let cartItems = [];
  let products = [];

  function money(cents) {
    return new Intl.NumberFormat("en-AU", {
      style: "currency",
      currency: "AUD"
    }).format((cents || 0) / 100);
  }

  function showStatus(message) {
    const status = document.getElementById("status");

    if (status) {
      status.textContent = message;
    }
  }

  async function startCheckout() {

    if (!window.supabase) {
      showStatus("SUPABASE CONNECTION FAILED.");
      return;
    }

    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "./account.html";
      return;
    }

    const user = session.user;

    document.getElementById("email").value = user.email || "";

    const { data: cartData, error: cartError } =
      await supabaseClient
        .from("cart_items")
        .select("id, product_id, quantity")
        .eq("user_id", user.id);

    if (cartError) {
      console.error(cartError);
      showStatus("COULD NOT LOAD CART.");
      return;
    }

    if (!cartData || cartData.length === 0) {
      showStatus("YOUR CART IS EMPTY.");
      document.getElementById("payment-button").disabled = true;
      return;
    }

    cartItems = cartData;

    const productIds = cartItems.map(item => item.product_id);

    const { data: productData, error: productError } =
      await supabaseClient
        .from("products")
        .select("*")
        .in("id", productIds);

    if (productError) {
      console.error(productError);
      showStatus("COULD NOT LOAD PRODUCTS.");
      return;
    }

    products = productData || [];

    renderSummary();

    showStatus("");
  }

  function renderSummary() {

    const summary = document.getElementById("summary-items");

    summary.innerHTML = "";

    let subtotal = 0;

    cartItems.forEach(item => {

      const product = products.find(
        p => p.id === item.product_id
      );

      if (!product) return;

      const price = product.price || 0;
      const quantity = item.quantity || 1;

      subtotal += price * quantity;

      const row = document.createElement("div");

      row.className = "summary-item";

      row.innerHTML = `
        <div>
          <span class="summary-item-name">
            ${product.name}
          </span>
          <span class="summary-item-qty">
            × ${quantity}
          </span>
        </div>

        <span>
          ${money(price * quantity)}
        </span>
      `;

      summary.appendChild(row);
    });

    document.getElementById("subtotal").textContent =
      money(subtotal) + " AUD";

    document.getElementById("total").textContent =
      money(subtotal) + " AUD";
  }


  document
    .getElementById("country")
    .addEventListener("change", function () {

      const region = document.getElementById("region");

      const australiaStates = [
        "New South Wales",
        "Victoria",
        "Queensland",
        "Western Australia",
        "South Australia",
        "Tasmania",
        "Northern Territory",
        "Australian Capital Territory"
      ];

      if (this.value === "AU") {

        region.outerHTML = `
          <select
            id="region"
            name="region"
            autocomplete="address-level1"
            required
          >
            <option value="">SELECT STATE</option>
            ${australiaStates.map(state =>
              `<option value="${state}">${state}</option>`
            ).join("")}
          </select>
        `;

      } else {

        const newRegion = document.createElement("input");

        newRegion.id = "region";
        newRegion.name = "region";
        newRegion.autocomplete = "address-level1";
        newRegion.placeholder = "State / province / region";
        newRegion.required = true;

        region.outerHTML = newRegion.outerHTML;
      }
    });


  document
    .getElementById("checkout-form")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const button = document.getElementById("payment-button");

      button.disabled = true;
      button.textContent = "PAYMENT COMING NEXT...";

      console.log({
        email: document.getElementById("email").value,
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        country: document.getElementById("country").value,
        address: document.getElementById("address").value,
        city: document.getElementById("city").value,
        region: document.getElementById("region").value,
        postcode: document.getElementById("postcode").value,
        phone: document.getElementById("phone").value
      });
    });


  window.addEventListener("supabase-ready", startCheckout);

  if (window.supabase) {
    startCheckout();
  }
</script>

</body>
</html>

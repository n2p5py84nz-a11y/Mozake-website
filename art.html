<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ART — MOZake</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #e2ded4;
      color: #111;
    }

    /* HEADER */

    header {
      width: 100%;
      height: 90px;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      width: 62px;
      height: 48px;
    }

    .mozake-logo {
      width: 62px;
      height: 48px;
      display: block;
      overflow: visible;
    }

    .mozake-logo polygon {
      fill: #111;
    }

    nav {
      display: flex !important;
      gap: 40px !important;
      align-items: center !important;
    }

    nav a {
      color: #111 !important;
      text-decoration: none !important;
      font-size: 21px !important;
      font-weight: 600 !important;
      letter-spacing: 2.5px !important;
      white-space: nowrap !important;
      line-height: 1 !important;
    }

    /* ART HERO */

    .art-hero {
      min-height: 28vh;
      padding: 20px 40px 25px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border-bottom: 1px solid #111;
    }

    .art-label {
      font-size: 20px;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .art-title {
      font-size: clamp(120px, 25vw, 360px);
      font-weight: 700;
      line-height: 0.78;
      letter-spacing: -10px;
    }

    /* FEATURED ART */

    .featured {
      padding: 75px 40px 120px;
      border-bottom: 1px solid #111;
    }

    .section-label {
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 45px;
    }

    .artwork-container {
      width: 100%;
      min-height: 650px;
      background: #d8d3c8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .artwork-image {
      width: 100%;
      height: 650px;
      object-fit: contain;
      display: block;
    }

    .art-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
      margin-top: 35px;
    }

    .art-info h2 {
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    .art-info p {
      max-width: 500px;
      margin-top: 12px;
      font-size: 16px;
      line-height: 1.5;
    }

    .view-link {
      color: #111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    /* FOOTER */

    footer {
      padding: 70px 40px 40px;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }

    .footer-logo {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -2px;
    }

    .footer-slogan {
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 600;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 90px;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        height: 75px;
        padding: 18px 20px;
      }

      .logo {
        width: 48px;
        height: 38px;
      }

      .mozake-logo {
        width: 48px;
        height: 38px;
      }

      nav {
        gap: 12px !important;
        flex-shrink: 0 !important;
      }

      nav a {
        font-size: 12px !important;
        font-weight: 600 !important;
        letter-spacing: 1.2px !important;
      }

      .art-hero {
        min-height: 24vh;
        padding: 20px 20px 20px;
      }

      .art-label {
        font-size: 15px;
        letter-spacing: 2px;
        margin-bottom: 15px;
      }

      .art-title {
        font-size: 30vw;
        letter-spacing: -4px;
      }

      .featured {
        padding: 60px 20px 80px;
      }

      .section-label {
        margin-bottom: 30px;
      }

      .artwork-container {
        min-height: 420px;
      }

      .artwork-image {
        height: 420px;
      }

      .art-info {
        display: block;
        margin-top: 25px;
      }

      .art-info h2 {
        font-size: 28px;
      }

      .art-info p {
        margin-top: 18px;
        font-size: 14px;
      }

      .view-link {
        display: inline-block;
        margin-top: 25px;
      }

      footer {
        padding: 50px 20px 30px;
      }

      .footer-top {
        display: block;
      }

      .footer-logo {
        font-size: 34px;
      }

      .footer-slogan {
        margin-top: 20px;
      }

      .footer-bottom {
        margin-top: 60px;
        gap: 20px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="./index.html" class="logo" aria-label="MOZake">
      <svg
        class="mozake-logo"
        viewBox="0 0 82 58"
        aria-label="MOZake logo">

        <polygon points="2,55 29,7 56,55"></polygon>
        <polygon points="27,51 54,3 81,51"></polygon>

      </svg>
    </a>

    <nav>
      <a href="./art.html">ART</a>
      <a href="./index.html#clothing">CLOTHING</a>
      <a href="./index.html#collectibles">COLLECTIBLES</a>
      <a href="./index.html#story">STORY</a>
      <a href="./index.html#shop">SHOP</a>
    </nav>

  </header>


  <main>

    <section class="art-hero">

      <div class="art-label">
        THE WORLD OF MOZake
      </div>

      <h1 class="art-title">
        ART
      </h1>

    </section>


    <section class="featured">

      <div class="section-label">
        FEATURED
      </div>

      <div class="artwork-container">

        <img
          src="./artwork01.JPG"
          alt="MOZake creating his first graffiti"
          class="artwork-image"
          loading="eager">

      </div>

      <div class="art-info">

        <div>

          <h2>FIRST MARK</h2>

          <p>
            MOZake leaves his first mark. The beginning of a world created
            through art, imagination and the need to make something exist.
          </p>

        </div>

        <a href="#" class="view-link">
          VIEW →
        </a>

      </div>

    </section>

  </main>


  <footer>

    <div class="footer-top">

      <div class="footer-logo">
        MOZake
      </div>

      <div class="footer-slogan">
        MAKE IT EXIST.
      </div>

    </div>

    <div class="footer-bottom">

      <span>ART</span>
      <span>CLOTHING</span>
      <span>COLLECTIBLES</span>

    </div>

  </footer>

</body>
</html>
